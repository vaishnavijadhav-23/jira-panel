<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Info Panel</title>

    <!-- Adaptavist Bridge -->
    <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/latest/bridge.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 12px;
            background: #f4f5f7;
        }

        .card {
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h3 {
            margin-top: 0;
            color: #172B4D;
        }

        #issueInfo {
            color: #0052CC;
            font-size: 14px;
            font-weight: bold;
        }

        pre {
            background: #f7f7f7;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="card">
    <h3>Issue Details</h3>
    <p id="issueInfo">Loading issue details...</p>
    <pre id="contextBox"></pre>
</div>

<script>
    console.log("Bridge object:", window.AdaptavistBridge);
    console.log("Context:", window.AdaptavistBridgeContext);

    // Show context first
    document.getElementById("contextBox").innerText =
        JSON.stringify(window.AdaptavistBridgeContext.context, null, 2);

    // Fetch issue details dynamically
    AdaptavistBridge.request({
        url: `/rest/api/2/issue/${AdaptavistBridgeContext.context.issueKey}`,
        type: 'GET'
    })
    .then(issue => {
        console.log("Issue response:", issue);

        document.getElementById("issueInfo").innerText =
            `${issue.key} is a ${issue.fields.issuetype.name} currently in status "${issue.fields.status.name}"`;
    })
    .catch(error => {
        console.error("API Error:", error);
        document.getElementById("issueInfo").innerText =
            "Unable to fetch issue details.";
    });
</script>

</body>
</html>
