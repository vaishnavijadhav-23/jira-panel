<!DOCTYPE html>
<html lang="en">
<head>
    <title>Issue Info Panel</title>

    <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/latest/bridge.js"></script>

</head>
<body>

<div>
    <p id="status">Search Related Documents in confluence</p>
    <button id="searchConfluence">Search Confluence Docs</button>
    
</div>

<script>

    let issuekey;
    let issuesummary;
    let jiraBaseUrl;
 
    console.log("Context:", window.AdaptavistBridgeContext);
   
    AdaptavistBridge.request({
        url: `/rest/api/2/issue/${AdaptavistBridgeContext.context.issueKey}`,
        type: 'GET'
    })
    .then(issue => {
       baseurl=issue.self;
        jiraBaseUrl = issue.self.split("/rest/api")[0];
        issuekey=issue.key;
        issuesummary=issue.fields.summary;
        console.log("Issue response:", issue);
        console.log("Issue Summary : ",issuesummary)
        console.log("BaseUrl : ",jiraBaseUrl)
        

    })
    .catch(error => {
        console.error("API Error:", error);
        document.getElementById("status").innerText =
            "Unable to fetch issue details.";
    });

    
   document.getElementById("searchConfluence").addEventListener("click", () => {
  const searchUrl = `${jiraBaseUrl}/wiki/search?text=${encodeURIComponent(issuesummary)}`;
  window.open(searchUrl, "_blank");
});
</script>

</body>
</html>
