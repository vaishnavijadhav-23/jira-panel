<!DOCTYPE html>
<html lang="en">
<head>
    <title>Issue Info Panel</title>

    <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/latest/bridge.js"></script>

</head>
<body>

<div>
    <p>Search Related Documents in confluence</p>
    <button onclick="searchConfluence()" class="btn">Search Confluence Docs</button>
    
    <p id="status">Loading issue details...</p>
</div>

<script>

    let issuekey;
    let issuesummary;
    
    console.log("Bridge object:", window.AdaptavistBridge);
    console.log("Context:", window.AdaptavistBridgeContext);
   
    AdaptavistBridge.request({
        url: `/rest/api/2/issue/${AdaptavistBridgeContext.context.issueKey}`,
        type: 'GET'
    })
    .then(issue => {

        issuekey=issue.key;
        issuesummary=issue.summary;
        
        console.log("Issue response:", issue);
     
        document.getElementById("status").innerText =
            ` Ready ${issue.key}`;
    })
    .catch(error => {
        console.error("API Error:", error);
        document.getElementById("status").innerText =
            "Unable to fetch issue details.";
    });

    function searchConfluence(){
        document.getElementById("status").innerText=
            "searching..."
    }
</script>

</body>
</html>
