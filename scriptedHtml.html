<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Cloud Script Fragment with Adaptavist Bridge</title>
    
    <!-- Load the official Adaptavist Bridge library -->
    <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js" async></script>
    
    <style>
        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 8px;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .custom-btn {
            background-color: #0052CC;
            color: #FFFFFF;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.1s ease;
            width: 100%;
            text-align: center;
        }
        .custom-btn:hover { background-color: #0065FF; }
        .custom-btn:active { background-color: #0747A6; }
        .custom-btn:disabled { background-color: #A5B4FC; cursor: not-allowed; }
        #status-message {
            font-size: 12px;
            color: #6B778C;
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- UI Button component -->
        <button id="action-btn" class="custom-btn" onclick="executeFragmentAction()">
            🚀 Process Issue
        </button>
        <div id="status-message"></div>
    </div>

    <script>
        function executeFragmentAction() {
            const btn = document.getElementById('action-btn');
            const statusDiv = document.getElementById('status-message');
            
            btn.disabled = true;
            statusDiv.style.color = "#6B778C";
            statusDiv.innerText = "Checking Adaptavist Bridge...";

            // Check if the Adaptavist Bridge library is loaded and ready
            if (typeof window.AdaptavistBridge === 'undefined') {
                statusDiv.style.color = "#DE350B";
                statusDiv.innerText = "Error: Adaptavist Bridge not initialized yet.";
                btn.disabled = false;
                return;
            }

            // Extract context data directly from the bridge object
            const bridgeContext = window.AdaptavistBridge.context;
            const issueKey = bridgeContext ? bridgeContext.issueKey : null;

            if (!issueKey) {
                statusDiv.style.color = "#DE350B";
                statusDiv.innerText = "Error: Could not retrieve active Issue Key.";
                btn.disabled = false;
                return;
            }

            statusDiv.innerText = `Processing key: ${issueKey}...`;

            // Setup your target ScriptRunner endpoint or external REST service
            const endpointUrl = `https://atlassian.net{issueKey}`;

            // Make a secure token-authorized request handled through Adaptavist's router
            fetch(endpointUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                }
            })
            .then(res => {
                if (res.ok) {
                    statusDiv.style.color = "#36B37E";
                    statusDiv.innerText = `Success! Action completed for ${issueKey}.`;
                } else {
                    throw new Error(`Server error: ${res.status}`);
                }
            })
            .catch(err => {
                statusDiv.style.color = "#DE350B";
                statusDiv.innerText = "Error: Backend processing failed.";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
